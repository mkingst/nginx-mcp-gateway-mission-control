# NGINX MCP gateway: early JSON body inspection, tool RBAC and predicate routing.
load_module modules/ngx_http_js_module.so;
load_module modules/ngx_otel_module.so;
worker_processes auto;
error_log /dev/stderr notice;
events { worker_connections 1024; }
http {
    map $http_content_type $mcp_json_content_type {
        default 0;
        "~*^application/json([[:space:]]*;|$)" 1;
    }
    json_set $mcp_body_method $request_body method;
    json_set $mcp_body_tool   $request_body params.name;
    # Resolve demo API keys to agent roles.
    include /etc/nginx/demo-conf/demo-api-keys.conf;
    map $agent_role $deny_unauthenticated {
        default 0;
        "anonymous" 1;
    }
    # Fail closed: a POST whose JSON-RPC method cannot be read (JSON batch array,
    # invalid JSON, non-JSON content type) is rejected rather than proxied unchecked.
    map "$request_method:$mcp_body_method" $deny_malformed {
        default 0;
        "POST:" 1;
    }
    # Tool RBAC allowlist: every tools/call is denied unless granted here.
    map "$agent_role:$mcp_body_method:$mcp_body_tool" $deny_unauthorized {
        default 0;
        ~^(viewer|operator|admin):tools/call:(list_pods|get_pod|list_records|read_record|echo|slow_operation|fail_operation)$ 0;
        ~^(operator|admin):tools/call:(create_pod|update_pod|create_record|update_record)$ 0;
        ~^admin:tools/call:(delete_pod|delete_record)$ 0;
        ~:tools/call: 1;
    }
    # Independent per-tool, per-client buckets (only tools/call requests).
    limit_req_zone $binary_remote_addr zone=pod_read:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=pod_create:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=pod_delete:10m rate=1r/s;
    map $limit_req_status $mcp_limit_policy { REJECTED "rate-limited"; default "allowed"; }
    map "$mcp_body_method:$mcp_body_tool" $is_list_pods { default 0; "tools/call:list_pods" 1; }
    map "$mcp_body_method:$mcp_body_tool" $is_create_pod { default 0; "tools/call:create_pod" 1; }
    map "$mcp_body_method:$mcp_body_tool" $is_delete_pod { default 0; "tools/call:delete_pod" 1; }
    upstream mcp_backend { server mcp:3001; }
    # Supporting NGINX and OpenTelemetry configuration.
    include /etc/nginx/mcp/mcp-http-support.conf;
    include /etc/nginx/demo-conf/mcp-observability.conf;
    server {
        listen 8080;
        server_name _;
        client_body_early_read $mcp_json_content_type;
        include /etc/nginx/mcp/mcp-body.conf;
        include /etc/nginx/mcp/mcp-server-observability.conf;
        location = /health {
            default_type text/plain;
            return 200 "NGINX OK\n";
        }
        location $deny_unauthenticated {
            add_header WWW-Authenticate 'ApiKey realm="MCP Gateway"' always;
            add_header X-MCP-Policy "unauthenticated" always;
            return 401 "Missing or invalid MCP API key\n";
        }
        location $deny_malformed {
            add_header X-MCP-Policy "malformed" always;
            return 400 "Unreadable or batched JSON-RPC request\n";
        }
        location $deny_unauthorized {
            add_header X-MCP-Policy "role-denied" always;
            return 403 "NGINX RBAC denied this MCP tool\n";
        }
        # Tool-specific rate limits; proxy behavior is shared via an include.
        location $is_list_pods {
            limit_req zone=pod_read burst=5 nodelay;
            include /etc/nginx/mcp/mcp-proxy.conf;
        }
        location $is_create_pod {
            limit_req zone=pod_create burst=2 nodelay;
            include /etc/nginx/mcp/mcp-proxy.conf;
        }
        location $is_delete_pod {
            limit_req zone=pod_delete burst=1 nodelay;
            include /etc/nginx/mcp/mcp-proxy.conf;
        }
        # Everything else allowed above (initialize, tools/list, permitted tools).
        location /mcp {
            include /etc/nginx/mcp/mcp-proxy.conf;
        }
    }
}
