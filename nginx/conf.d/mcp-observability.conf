# Supporting telemetry setup — intentionally kept out of the live-demo config.
# This file is included from the http {} context.
js_engine qjs;
include /etc/nginx/mcp/mcp-njs.conf;

# Optional MCP metadata extracted with the same native JSON functionality.
# Forward-looking: current MCP SDK clients do not send these _meta fields,
# so these span attributes are usually empty.
json_set $mcp_body_version $request_body
    'params._meta["io.modelcontextprotocol/protocolVersion"]';
json_set $mcp_client $request_body
    'params._meta["io.modelcontextprotocol/clientInfo"].name';

# Tool name, only for tools/call requests (used for both gen_ai.tool.name and
# mcp.tool.attempted span attributes).
map $mcp_body_method $mcp_metric_tool {
    "tools/call" $mcp_body_tool;
    default "";
}

# The variables below are evaluated when the span is exported (end of request),
# so they are marked volatile to always reflect the final request state.

# Gateway decision for this request. Order mirrors the predicate locations.
map "$deny_unauthenticated:$deny_malformed:$deny_unauthorized:$limit_req_status" $mcp_policy {
    volatile;
    ~^1:           "unauthenticated";
    ~^0:1:         "malformed";
    ~^0:0:1:       "blocked";
    ~:REJECTED$    "rate_limited";
    default        "allowed";
}

# Backend label only when NGINX actually proxied the request.
map $upstream_addr $mcp_upstream {
    volatile;
    ""      "";
    default mcp;
}

# MCP semantic outcome only for proxied tools/call requests. NGINX's own
# 401/400/403/429 responses, and initialize/tools/list (which the observer
# would classify as invalid_response), get an empty outcome.
map "$mcp_body_method|$upstream_addr|$mcp_outcome" $mcp_span_outcome {
    volatile;
    ~^tools/call\|[^|]+\|(.*)$  $1;
    default                     "";
}

# NGINX OpenTelemetry exporter.
otel_service_name nginx-mcp-edge;
otel_exporter { endpoint otel-collector:4317; }
