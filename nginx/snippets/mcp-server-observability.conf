# NGINX OTel spans and official nginx-mcp-js response observer.
# Included from server {} to keep the core demonstration concise.
include /etc/nginx/mcp/mcp-otel.conf;
otel_span_attr "mcp.outcome" $mcp_span_outcome;
otel_span_attr "mcp.rpc.code" $mcp_rpc_code;
otel_span_attr "mcp.policy" $mcp_policy;
otel_span_attr "mcp.agent.role" $agent_role;
otel_span_attr "mcp.tool.attempted" $mcp_metric_tool;
